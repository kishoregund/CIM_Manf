<div class="notification-icon-container">
  <!-- Notification Icon with Badge -->
  <div class="notification-icon-wrapper" (click)="toggleNotificationPanel()" title="Notifications">
    <svg class="notification-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    <span class="notification-badge" #notificationBadge>0</span>
  </div>

  <!-- Backdrop for closing panel -->
  <div class="notification-backdrop" *ngIf="isPanelOpen" (click)="onBackdropClick()"></div>

  <!-- Notification Panel -->
  <div class="notification-panel" #notificationPanel [ngClass]="{'show': isPanelOpen}">
    <!-- Header -->
    <div class="notification-header">
      <h3 class="notification-title">Notifications</h3>
      <div class="notification-actions">
        <button class="clear-btn"
                (click)="clearAllNotifications()"
                [disabled]="notifications.length === 0"
                title="Clear all notifications">
          Clear All
        </button>
        <button class="close-btn" (click)="closeNotificationPanel()" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Loading State -->
    <div class="notification-loading" *ngIf="isLoading">
      <div class="spinner"></div>
      <p>Loading notifications...</p>
    </div>

    <!-- Notifications List -->
    <div class="notification-list" *ngIf="!isLoading">
      <div *ngIf="notifications.length === 0" class="no-notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </svg>
        <p>No notifications</p>
      </div>

      <div *ngFor="let notification of notifications" class="notification-item">
        <div class="notification-content">
          <p class="notification-message">{{ notification.remarks }}</p>
          <small class="notification-time">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-small">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            {{ formatDate(notification.createdOn) }}
          </small>
          <!-- <small class="notification-from" *ngIf="notification.raisedBy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-small">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            by {{ notification.raisedBy }}
          </small> -->
        </div>
        <button class="delete-notification-btn"
                (click)="deleteNotification(notification.id)"
                title="Delete notification">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
