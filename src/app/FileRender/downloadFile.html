<div *ngIf="list && list.length > 0; else noFiles">
    <ul>
        <li *ngFor="let item of list;let index = index" (click)="download(item?.id,item.displayName)"
            style="background-color: transparent;border: none;padding: 0;margin-top: 0px;word-break: break-all;"
            class="text-primary">
            {{item?.displayName}}</li>
    </ul>
</div>

<ng-template #noFiles>
    <span style="color: #999; font-size: 12px;">No files</span>
</ng-template>

<style>
    li:hover {
        cursor: pointer;
    }
</style>
